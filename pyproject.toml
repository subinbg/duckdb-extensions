[project]
name = "duckdb-extensions"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.0",
]

[dependency-groups]
build = [
    "cryptography>=50.0.2",
]
test = [
    "pytest>=8.4.2",
]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

# What scripts/fetch_core.py mirrors from extensions.duckdb.org for the DuckDB version pinned above,
# and the platforms whose binaries core-extensions.sha256 pins.
[tool.duckdb-extensions]
core = ["httpfs", "iceberg", "avro", "sqlite_scanner"]
platforms = ["linux_amd64", "linux_arm64", "osx_arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.pyrefly]
preset = "strict"
project-includes = ["scripts", "tests"]
search-path = [".", "scripts"]

[tool.ruff]
line-length = 120
src = [".", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
