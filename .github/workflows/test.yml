# The GitHub Actions system: runners that come with cargo, and get uv.
# What they build and test is not decided here: every `run` below is a command of README.md "Build and test".

name: test
on: push

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - run: cargo test --locked
      - run: >
          uv run scripts/build.py --duckdb-version v2.0.0 --core build/core --custom build/custom
          httpfs iceberg avro sqlite_scanner
      - run: uv run --locked pytest
