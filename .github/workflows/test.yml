# The GitHub Actions system: runners that come with cargo and make, and get uv.
# What they build and test is not decided here: the commands are those of the Makefile, with the arguments of build.env.

name: test
on: push

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked

      - run: cargo test --locked
      - run: make build
      - run: make test
