[workspace]
members = ["extensions/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
duckdb = { version = "=1.20000.2", default-features = false, features = ["loadable-extension", "vscalar"] }
libduckdb-sys = { version = "=1.20000.2", default-features = false, features = ["loadable-extension"] }

[profile.release]
lto = true
strip = true
