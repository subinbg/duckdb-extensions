[package]
# The package name is the extension name: lowercase letters, digits and underscores.
name = "bigquery"
# Written into the extension metadata (shown as extension_version in duckdb_extensions()).
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The stable C API version the extension asks DuckDB for; scripts/build.py writes it into the extension footer.
[package.metadata.duckdb]
capi-version = "v1.5.6"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The release duckdb converts from: Google's record batches are handed to it as they are decoded.
arrow = { version = "60", default-features = false, features = ["ipc"] }
duckdb.workspace = true
google-cloud-auth = "1.19"
google-cloud-bigquery = "0.20"
google-cloud-bigquery-v2 = "1.1"
google-cloud-gax = "1.15"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
