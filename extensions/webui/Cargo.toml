[package]
# The package name is the extension name: lowercase letters, digits and underscores.
name = "webui"
# Written into the extension metadata (shown as extension_version in duckdb_extensions()).
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The stable C API version the extension asks DuckDB for; scripts/build_custom.py writes it into the extension footer.
[package.metadata.duckdb]
capi-version = "v1.5.6"

[lib]
crate-type = ["cdylib"]

[dependencies]
libduckdb-sys.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
