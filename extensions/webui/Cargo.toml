[package]
# The package name is the extension name: lowercase letters, digits and underscores.
name = "webui"
# Written into the extension metadata (shown as extension_version in duckdb_extensions()).
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# webui runs SQL on its own connections, which only DuckDB's stable C API (v1) can open.
# scripts/package_extension.py writes these into the extension footer instead of the defaults.
[package.metadata.duckdb]
abi-type = "C_STRUCT"
capi-version = "v1.5.6"

[lib]
crate-type = ["cdylib"]

[dependencies]
libduckdb-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
webui-protocol.workspace = true
